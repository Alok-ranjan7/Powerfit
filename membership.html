<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Membership</title>
    <link rel="stylesheet" href="membership.css">
</head>

<body>

    <header>
        <h1>Join Our Gym</h1>
        <p>Start your fitness journey with us today</p>
    </header>

    <section class="membership">

        <h2>Membership Registration</h2>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Phone Number</label>
            <input type="number" placeholder="Enter phone number">

            <label>Select Membership Plan</label>
            <select>
                <option>Basic Plan - ₹999/month</option>
                <option>Premium Plan - ₹1999/month</option>
                <option>Elite Plan - ₹2999/month</option>
            </select>

            <label>Fitness Goal</label>
            <textarea placeholder="Weight loss, Muscle gain, Fitness..."></textarea>

            <button type="submit">Become a Member</button>

        </form>

    </section>

</body>
</html>
